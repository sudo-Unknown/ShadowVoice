version: '3.8'

services:
  voicemail-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-voicemail-agent
    restart: unless-stopped
    ports:
      - "3050:3050"
    environment:
      - PORT=3050
      - OWNER_NAME=${OWNER_NAME:-Smit}
      - OWNER_ROLE=${OWNER_ROLE:-Software Engineer & Builder}
      - OWNER_STATUS=${OWNER_STATUS:-Currently busy. Available after 5:00 PM for urgent matters.}
      - OWNER_BIO=${OWNER_BIO:-Specializes in AI systems, full-stack software development, cybersecurity, and cloud automation.}
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-cyber-coder:fast}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - TWILIO_VOICE=${TWILIO_VOICE:-Polly.Matthew-Neural}
      - TWILIO_LANGUAGE=${TWILIO_LANGUAGE:-en-US}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - voicemail_data:/app/data
    extra_hosts:
      # Allows reaching Ollama running on the host machine
      - "host.docker.internal:host-gateway"

volumes:
  voicemail_data:
    name: voicemail_data
