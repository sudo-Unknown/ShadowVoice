name: Build ShadowVoice Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Initialize Gradle Wrapper
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVoice-Hub-Debug-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: ShadowVoice Hub v1.0.0 (Build #${{ github.run_number }})
          draft: false
          prerelease: false
          body: |
            ## 📱 ShadowVoice Hub Android APK • Build #${{ github.run_number }}
            
            This APK was automatically compiled by GitHub Actions from commit `${{ github.sha }}`.
            
            ### ✨ Features Included:
            * **📞 Cellular Phone Call Screener**: Intercepts phone calls, screens with AI in **मराठी**, **हिन्दी**, and **English**, and streams live transcripts.
            * **🎙️ Take Over Call**: Instantly silence AI and speak directly with callers.
            * **📬 Voicemail Inbox**: View all voicemails, summaries, urgency badges, and action items.
            * **🖥️ VPS & Docker Infrastructure Monitor**: Real-time host CPU, RAM, Disk, Uptime, and 38+ containers status.
            * **🔄 Container Control**: One-tap container restarts directly from your phone.
            * **🤖 Multilingual AI Copilot**: Talk or type in Marathi, Hindi, or English to query server telemetry and voicemails.
            
            ### 📥 Download & Install:
            Download the attached **`app-debug.apk`** below directly onto your Android phone and install it.
          files: android-app/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
